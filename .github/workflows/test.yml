name: tests
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install vitest
        run: npm install --no-save --legacy-peer-deps vitest@4.1.10
      - name: Run unit tests (pure helpers)
        run: npx vitest run
